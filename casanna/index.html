<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEAPEST DATA LINK - Affordable Data Bundles</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loader" class="loader-wrapper">
        <div class="loader">
            <div class="loader-spinner">
                <div class="spinner-dot"></div>
                <div class="spinner-dot"></div>
                <div class="spinner-dot"></div>
            </div>
            <span class="loader-text">CHEAPEST DATA LINK</span>
        </div>
    </div>

    <div id="content">
        <header class="header-main">
            <div class="container">
                <div class="logo">
                    <div class="logo-icon-wrap">
                        <span>⚡</span>
                    </div>
                    <div>
                        <h1>CHEAPEST DATA LINK</h1>
                        <p class="tagline">Instant. Affordable. Reliable.</p>
                    </div>
                </div>
            </div>
        </header>

        <main class="container">
            <section class="hero">
                <h2>Buy Data <span class="hero-highlight">Instantly</span></h2>
                <p>Choose your network below</p>
            </section>

            <section class="providers">
                <div class="provider-card mtn-card" onclick="navigateTo('mtn')">
                    <div class="provider-glow mtn-glow"></div>
                    <div class="provider-icon mtn-bg">MTN</div>
                    <div class="provider-info">
                        <h3>MTN</h3>
                        <span class="provider-arrow">›</span>
                    </div>
                </div>

                <div class="provider-card telecel-card" onclick="navigateTo('telecel')">
                    <div class="provider-glow telecel-glow"></div>
                    <div class="provider-icon telecel-bg">TLC</div>
                    <div class="provider-info">
                        <h3>Telecel</h3>
                        <span class="provider-arrow">›</span>
                    </div>
                </div>

                <div class="provider-card tigo-card" onclick="navigateTo('tigo')">
                    <div class="provider-glow tigo-glow"></div>
                    <div class="provider-icon tigo-bg">AT</div>
                    <div class="provider-info">
                        <h3>Tigo</h3>
                        <span class="provider-arrow">›</span>
                    </div>
                </div>
            </section>

            <section class="trust-badge">
                <div class="trust-item">🔒 Secure Payment</div>
                <div class="trust-item">⚡ Instant Delivery</div>
                <div class="trust-item">💰 Best Prices</div>
            </section>

            <section class="help-section">
                <a href="mailto:pure.gold.achievement@gmail.com" class="help-link">For help, click here</a>
            </section>
        </main>

        <nav class="bottom-nav">
            <a href="mtn.html" class="nav-item mtn-nav">
                <div class="nav-dot mtn-dot"></div>
                <span>MTN</span>
            </a>
            <a href="telecel.html" class="nav-item telecel-nav">
                <div class="nav-dot telecel-dot"></div>
                <span>Telecel</span>
            </a>
            <a href="tigo.html" class="nav-item tigo-nav">
                <div class="nav-dot tigo-dot"></div>
                <span>Tigo</span>
            </a>
        </nav>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
